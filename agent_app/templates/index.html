<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <title>Agent?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // Blue gradient palette
                        blueGradient: {
                            50: "#e3f2fd",
                            100: "#000",
                            200: "#90caf9",
                            300: "#64b5f6",
                            400: "#42a5f5",
                            500: "#2196f3",
                            600: "#1e88e5",
                            700: "#1976d2",
                            800: "#1565c0",
                            900: "#f8edeb"
                        },
                        // Light/Dark backgrounds
                        'bg-light': '#f8fbff',
                        'bg-dark': '#90e0ef',
                        'card-light': '#ffffff',
                        'card-dark': '#111',
                        'input-light': '#ffffff',
                        'input-dark': '#1f2937'
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-btn {
            background: linear-gradient(135deg, #dee2e6, #e9ecef, #f8f9fa);
        }

        .gradient-btn:hover {
            background: linear-gradient(135deg, #2196f3, #1976d2, #1565c0);
        }

        .gradient-text {
            background: linear-gradient(135deg, #42a5f5, #2196f3, #1976d2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .glow-blue {
            box-shadow: 0 0 25px rgba(33, 150, 243, 0.4);
        }

        .font-mono {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', monospace;
        }
    </style>
</head>

<body class="min-h-screen bg-blueGradient-50 dark:bg-blueGradient-900 p-4 md:p-8">
    <div class="container max-w-2xl mx-auto">
        <div
            class="bg-card-light dark:bg-card-dark rounded-2xl border border-blueGradient-200 dark:border-blueGradient-700 p-8 shadow-2xl">
            <h1
                class="text-2xl font-bold font-mono mb-8 gradient-text bg-gradient-to-r from-blueGradient-400 via-blueGradient-500 to-blueGradient-600">
                Human
            </h1>

            <div class="space-y-6">
                <div>
                    <label
                        class="block text-sm font-semibold text-blueGradient-800 dark:text-blueGradient-200 mb-3 font-mono tracking-tight">
                        you have a question ? start talking
                    </label>
                    <input type="text" id="queryInput" placeholder="asking something..." maxlength="2000"
                        class="w-full px-6 py-5 rounded-2xl border-2 border-blueGradient-200 dark:border-blueGradient-600 bg-input-light dark:bg-input-dark text-blueGradient-900 dark:text-blueGradient-100 text-xl placeholder-blueGradient-400 dark:placeholder-blueGradient-300 focus:ring-4 focus:ring-blueGradient-400/40 focus:border-blueGradient-500 transition-all duration-300 font-medium focus:outline-none glow-blue shadow-lg" />
                    <div class="text-sm text-blueGradient-500 dark:text-blueGradient-400 mt-2 font-mono" id="charCount">
                        0/200</div>
                </div>

                <button onclick="askAgent()"
                    class="w-full h-14 px-8 gradient-btn text-black font-bold rounded-2xl font-mono text-xl hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 shadow-2xl hover:shadow-3xl hover:glow-blue disabled:opacity-50 disabled:cursor-not-allowed tracking-wide group">
                    <span> wouldn't you like to know</span>
                </button>
            </div>

            <div id="resultWindow"
                class="mt-8 min-h-[140px] rounded-2xl p-8 bg-blueGradient-50/80 dark:bg-blueGradient-900/50 border-2 border-blueGradient-200 dark:border-blueGradient-700 text-base text-blueGradient-900 dark:text-blueGradient-100 whitespace-pre-wrap hidden shadow-xl backdrop-blur-sm">
            </div>
        </div>

        <script>
            const queryInput = document.getElementById('queryInput');
            const resultWindow = document.getElementById('resultWindow');
            const charCount = document.getElementById('charCount');

            // Character counter
            queryInput.addEventListener('input', function () {
                charCount.textContent = this.value.length + '/2000';
            });

            // Enter key support
            queryInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    askAgent();
                }
            });

            async function askAgent() {
                const query = queryInput.value.trim();
                if (!query) return;

                const btn = document.querySelector('.gradient-btn');
                const originalText = btn.innerHTML;

                btn.disabled = true;
                btn.innerHTML = "<span>🤔 You'd think i am thinking...</span>";
                resultWindow.classList.add('hidden');

                try {
                    const res = await fetch('/api/ask/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query })
                    });
                    const data = await res.json();

                    if (data.error) {
                        resultWindow.innerHTML = `
                        <div class="flex items-start gap-4 p-6 rounded-2xl border-l-4 border-blueGradient-400 bg-blueGradient-100/80 dark:bg-blueGradient-900/50 dark:border-blueGradient-500 shadow-lg">
                            <div class="w-8 h-8 bg-blueGradient-400/20 rounded-xl flex items-center justify-center flex-shrink-0 border-2 border-blueGradient-300">
                                <span class="text-blueGradient-600 text-lg font-bold">!</span>
                            </div>
                            <div>
                                <h3 class="text-blueGradient-800 dark:text-blueGradient-200 font-semibold text-lg mb-2 font-mono">Error</h3>
                                <p class="text-blueGradient-700 dark:text-blueGradient-300">${data.error}</p>
                            </div>
                        </div>
                    `;
                    } else {
                        resultWindow.innerHTML = `
                        <div class="p-8 rounded-2xl bg-gradient-to-br from-blueGradient-50/90 to-blueGradient-100/70 dark:from-blueGradient-900/40 dark:to-blueGradient-800/30 border border-blueGradient-200/50 dark:border-blueGradient-700/50 shadow-2xl backdrop-blur-sm">
                            <div class="text-blueGradient-900 dark:text-blueGradient-100 whitespace-pre-wrap leading-relaxed font-medium">${data.message}</div>
                        </div>
                    `;
                    }
                    resultWindow.classList.remove('hidden');
                    resultWindow.scrollIntoView({ behavior: 'smooth' });
                } catch (error) {
                    resultWindow.innerHTML = `
                    <div class="flex items-start gap-4 p-6 rounded-2xl border-l-4 border-blueGradient-400 bg-blueGradient-100/80 dark:bg-blueGradient-900/50 dark:border-blueGradient-500 shadow-lg">
                        <div class="w-8 h-8 bg-blueGradient-400/20 rounded-xl flex items-center justify-center flex-shrink-0 border-2 border-blueGradient-300">
                            <span class="text-blueGradient-600 text-lg font-bold">!</span>
                        </div>
                        <div>
                            <h3 class="text-blueGradient-800 dark:text-blueGradient-200 font-semibold text-lg mb-2 font-mono">Network Error</h3>
                            <p class="text-blueGradient-700 dark:text-blueGradient-300">Please check your connection and try again.</p>
                        </div>
                    </div>
                `;
                    resultWindow.classList.remove('hidden');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            }

            // Focus on load
            window.addEventListener('load', () => queryInput.focus());
        </script>
    </div>

    <footer class="text-center text-sm text-blueGradient-500 dark:text-blueGradient-400 mt-12 mb-6 font-mono">
        © no rights reserved.
    </footer>
</body>

</html>
