{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homework Tutor</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
<main>
    <h1>Homework Tutor</h1>
    <p class="sub">I won't give you the answer. I'll help you work it out yourself.</p>

    <div class="pickers">
        <label>Grade
            <select id="grade">
                {% for g in grades %}<option value="{{ g }}"{% if g == "8" %} selected{% endif %}>Grade {{ g }}</option>{% endfor %}
            </select>
        </label>
        <label>Subject
            <select id="subject">
                {% for s in subjects %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
            </select>
        </label>
    </div>

    <div id="chat" aria-live="polite">
        <div class="msg tutor">Hi! What are you working on? Tell me the question and what you have tried so far.</div>
    </div>

    <form id="form">
        <input id="input" type="text" maxlength="2000" placeholder="Type your question..." autocomplete="off" aria-label="Your question">
        <button id="send" type="submit">Send</button>
    </form>

    <p class="note">Nothing you type is saved. Closing this page clears the conversation.</p>
</main>

<script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const history = [];

    function add(role, text) {
        const el = document.createElement('div');
        el.className = 'msg ' + role;
        el.textContent = text;
        chat.appendChild(el);
        chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        add('learner', text);
        history.push({ role: 'user', content: text });
        input.value = '';
        send.disabled = true;

        try {
            const res = await fetch('/api/ask/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    grade: document.getElementById('grade').value,
                    subject: document.getElementById('subject').value,
                    messages: history,
                }),
            });
            const data = await res.json();
            if (data.error) {
                add('error', data.error);
            } else {
                add('tutor', data.reply);
                history.push({ role: 'assistant', content: data.reply });
            }
        } catch (err) {
            add('error', 'Could not reach the tutor. Check your connection and try again.');
        } finally {
            send.disabled = false;
            input.focus();
        }
    });

    input.focus();
</script>
</body>
</html>
